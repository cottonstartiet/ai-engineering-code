[project]
name = "retail-support-demo"
version = "0.1.0"
description = "Observable Microsoft Agent Framework retail support sample"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-framework-core",
  "agent-framework-orchestrations",
  "agent-framework-openai",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3",
  "pydantic-settings>=2.7",
  "openai>=1.60",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-sqlalchemy",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28,<1",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_demo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL test database", "live: requires Azure credentials"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

